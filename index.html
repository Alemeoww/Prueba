<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica: Ingeniería de Software (RQY1102)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            line-height: 1.6;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #0056b3;
        }
        .quiz-container {
            background: #fff;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .question {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 15px;
        }
        .options label {
            display: block;
            background: #f9f9f9;
            margin-bottom: 10px;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .options label:hover:not(.disabled) {
            background: #e9ecef;
        }
        .options label.disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }
        
        /* Nuevas clases para pintar las alternativas */
        .options label.label-correct {
            background-color: #d4edda !important;
            border-color: #c3e6cb !important;
            color: #155724;
            font-weight: bold;
        }
        .options label.label-incorrect {
            background-color: #f8d7da !important;
            border-color: #f5c6cb !important;
            color: #721c24;
            text-decoration: line-through;
        }

        input[type="radio"] {
            margin-right: 10px;
            cursor: pointer;
        }
        .btn-restart {
            display: block;
            width: 100%;
            background: #28a745;
            color: #fff;
            border: none;
            padding: 15px;
            font-size: 1.2em;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 20px;
            margin-bottom: 40px;
        }
        .btn-restart:hover {
            background: #218838;
        }
        .result-text {
            margin-top: 10px;
            font-weight: bold;
            display: none;
            padding: 10px;
            border-radius: 5px;
        }
        .correct {
            color: #155724;
        }
        .incorrect {
            color: #721c24;
        }
        .score-display {
            text-align: center;
            font-size: 1.5em;
            font-weight: bold;
            margin-top: 20px;
            color: #333;
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: sticky;
            bottom: 0;
            border-top: 4px solid #0056b3;
            z-index: 100;
        }
    </style>
</head>
<body>

    <h1>Práctica: Ingeniería de Software</h1>
    <div id="quiz-form"></div>
    
    <div id="score-container" class="score-display">Puntaje: 0 / 40</div>
    <button class="btn-restart" onclick="initQuiz()">Reiniciar Práctica (Orden Aleatorio)</button>

    <script>
        const originalQuizData = [
            { q: "1. ¿Cuál es el principal objetivo de la Ingeniería de Software?", options: { A: "Aumentar la velocidad de programación", B: "Desarrollar software sin planificación", C: "Aplicar principios de ingeniería al desarrollo de software", D: "Reemplazar la gestión de proyectos" }, answer: "C" },
            { q: "2. ¿Qué diferencia principalmente a la Ingeniería de Software de la programación?", options: { A: "El uso de lenguajes modernos", B: "La creación de interfaces gráficas", C: "El enfoque sistemático y basado en procesos", D: "La escritura de código optimizado" }, answer: "C" },
            { q: "3. ¿Cuál de las siguientes NO corresponde a una etapa del ciclo de vida del software?", options: { A: "Análisis", B: "Diseño", C: "Implementación", D: "Comercialización" }, answer: "D" },
            { q: "4. La etapa de análisis del ciclo de vida del software tiene como propósito principal:", options: { A: "Codificar la solución", B: "Identificar y documentar requerimientos", C: "Ejecutar pruebas de aceptación", D: "Mantener el sistema" }, answer: "B" },
            { q: "5. ¿En qué etapa se transforma la solución lógica en código fuente?", options: { A: "Diseño", B: "Análisis", C: "Desarrollo", D: "Pruebas" }, answer: "C" },
            { q: "6. ¿Cuál es el objetivo principal de la etapa de pruebas (testing)?", options: { A: "Reducir costos", B: "Detectar y corregir errores", C: "Diseñar la arquitectura", D: "Documentar el sistema" }, answer: "B" },
            { q: "7. El mantenimiento del software se realiza principalmente:", options: { A: "Antes de la entrega", B: "Durante el diseño", C: "Después de la puesta en operación", D: "Solo en sistemas críticos" }, answer: "C" },
            { q: "8. ¿Qué evidencia que el curso enfatiza un enfoque práctico?", options: { A: "Clases solo teóricas", B: "Proyecto semestral basado en casos reales", C: "Uso exclusivo de pruebas escritas", D: "Evaluaciones individuales únicamente" }, answer: "B" },
            { q: "9. ¿Cuál es una característica clave del proyecto semestral del curso?", options: { A: "Desarrollo individual", B: "Aplicación parcial del ciclo de vida", C: "Trabajo en equipo con evaluación individual", D: "Enfoque únicamente teórico" }, answer: "C" },
            { q: "10. ¿Por qué es importante definir roles en un proyecto de software?", options: { A: "Para aumentar el tiempo de desarrollo", B: "Para evitar la planificación", C: "Para mejorar la coordinación y responsabilidades", D: "Para reducir la calidad del producto" }, answer: "C" },
            { q: "11. ¿Cuál de los siguientes es un beneficio del trabajo en equipos multidisciplinarios?", options: { A: "Menor control del proyecto", B: "Aislamiento de funciones", C: "Integración de distintas competencias", D: "Eliminación de la gestión" }, answer: "C" },
            { q: "12. La gestión de proyectos de software busca principalmente:", options: { A: "Programar más rápido", B: "Cumplir objetivos de tiempo, costo y calidad", C: "Eliminar las pruebas", D: "Reducir roles" }, answer: "B" },
            { q: "13. ¿Qué enfoque de gestión se caracteriza por su flexibilidad y adaptación al cambio?", options: { A: "Tradicional", B: "Predictivo", C: "Ágil", D: "Secuencial" }, answer: "C" },
            { q: "14. ¿Cuál es una actividad clave de la gestión de proyectos?", options: { A: "Ejecución de pruebas unitarias", B: "Planificación y seguimiento", C: "Programación individual", D: "Corrección de errores finales" }, answer: "B" },
            { q: "15. La calidad del software se relaciona directamente con:", options: { A: "La cantidad de líneas de código", B: "El cumplimiento de estándares y requisitos", C: "El uso de un solo lenguaje", D: "El tiempo de desarrollo" }, answer: "B" },
            { q: "16. ¿Qué busca el aseguramiento de la calidad del software?", options: { A: "Aumentar defectos", B: "Prevenir errores", C: "Evitar documentación", D: "Eliminar pruebas" }, answer: "B" },
            { q: "17. ¿Cuál es el propósito de un plan de pruebas?", options: { A: "Definir el diseño del sistema", B: "Establecer alcance, risks y estrategia de testing", C: "Documentar requerimientos", D: "Planificar el mantenimiento" }, answer: "B" },
            { q: "18. Las pruebas de aceptación (UAT) se realizan principalmente para:", options: { A: "Validar con el usuario final", B: "Probar el código fuente", C: "Medir rendimiento técnico", D: "Revisar arquitectura" }, answer: "A" },
            { q: "19. ¿Cuál de las siguientes pruebas detecta errores tras cambios en el sistema?", options: { A: "Pruebas unitarias", B: "Pruebas de aceptación", C: "Pruebas de regresión", D: "Pruebas exploratorias" }, answer: "C" },
            { q: "20. ¿Qué documento orienta la evaluación final transversal del curso?", options: { A: "Cronograma general", B: "Pauta de Evaluación Final Transversal", C: "Plan de pruebas", D: "Carta Gantt" }, answer: "B" },
            { q: "21. El examen final transversal evalúa principalmente:", options: { A: "Conocimientos teóricos aislados", B: "Aplicación integral de Ingeniería de Software", C: "Programación avanzada", D: "Uso de un lenguaje específico" }, answer: "B" },
            { q: "22. ¿Por qué se utilizan casos reales en las evaluaciones finales?", options: { A: "Para aumentar dificultad innecesaria", B: "Para simular contextos profesionales", C: "Para reducir la evaluación", D: "Para evaluar solo teoría" }, answer: "B" },
            { q: "23. El caso de estudio “Proceso de Aduanas” permite evaluar:", options: { A: "Solo análisis", B: "Solo diseño", C: "El ciclo de vida completo", D: "Solo pruebas" }, answer: "C" },
            { q: "24. ¿Qué competencia transversal fomenta el curso?", options: { A: "Trabajo individual exclusivo", B: "Comunicación y trabajo en equipo", C: "Competencia entre estudiantes", D: "Programación sin documentación" }, answer: "B" },
            { q: "25. ¿Cuál es una responsabilidad del rol asignado en un equipo de software?", options: { A: "Ignorar otras áreas", B: "Cumplir funciones específicas del proyecto", C: "Trabajar aisladamente", D: "Evitar comunicación" }, answer: "B" },
            { q: "26. ¿Cuál es una ventaja de aplicar metodologías formales?", options: { A: "Mayor improvisación", B: "Control y trazabilidad del proyecto", C: "Menor documentación", D: "Eliminación de pruebas" }, answer: "B" },
            { q: "27. ¿Qué se evalúa en una prueba escrita del curso?", options: { A: "Código desarrollado", B: "Conocimiento del ciclo de vida y fundamentos", C: "Presentación oral", D: "Trabajo grupal" }, answer: "B" },
            { q: "28. ¿Qué tipo de evaluación corresponde a los encargos con presentación?", options: { A: "Solo formativa", B: "Diagnóstica", C: "Sumativa aplicada", D: "Informal" }, answer: "C" },
            { q: "29. ¿Qué carácter tiene la evaluación final transversal?", options: { A: "Individual exclusivamente", B: "Grupal con evaluación individual", C: "Solo teórica", D: "Sin presentación" }, answer: "B" },
            { q: "30. ¿Qué recurso se utiliza para simular entornos reales de gestión?", options: { A: "Editores de texto", B: "Herramientas de gestión de proyectos", C: "Diagramas manuales", D: "Correos electrónicos" }, answer: "B" },
            { q: "31. ¿Cuál es una función del cronograma del curso?", options: { A: "Evaluar el código", B: "Organizar contenidos y evaluaciones", C: "Probar software", D: "Documentar pruebas" }, answer: "B" },
            { q: "32. ¿Qué se busca al comparar enfoques tradicionales y ágiles?", options: { A: "Eliminar uno de ellos", B: "Comprender ventajas y contextos de aplicación", C: "Usar solo uno", D: "Reducir planificación" }, answer: "B" },
            { q: "33. ¿Qué documento define criterios de evaluación para docentes?", options: { A: "Cronograma", B: "Pauta ET Docente", C: "Plan de pruebas", D: "Caso de estudio" }, answer: "B" },
            { q: "34. ¿Cuál es el rol del testing en la calidad del software?", options: { A: "Generar requerimientos", B: "Identificar defectos antes de liberar el sistema", C: "Diseñar arquitectura", D: "Mantener el sistema" }, answer: "B" },
            { q: "35. ¿Qué evidencia el uso de estándares de la industria?", options: { A: "Improvisación", B: "Buenas prácticas documentadas", C: "Desarrollo informal", D: "Uso de código sin pruebas" }, answer: "B" },
            { q: "36. La evaluación por proyecto permite principalmente:", options: { A: "Aprendizaje memorístico", B: "Integración teoría–práctica", C: "Calificación rápida", D: "Evaluación superficial" }, answer: "B" },
            { q: "37. ¿Qué se espera del estudiante al finalizar el curso?", options: { A: "Programar sin documentación", B: "Aplicar el ciclo de vida del software", C: "Memorizar definiciones", D: "Evitar trabajo en equipo" }, answer: "B" },
            { q: "38. ¿Qué tipo de organización favorece la Ingeniería de Software?", options: { A: "Caótica", B: "Basada en procesos", C: "Informal", D: "Sin roles definidos" }, answer: "B" },
            { q: "39. ¿Por qué es clave la documentación en Ingeniería de Software?", options: { A: "Aumenta el código", B: "Facilita mantenimiento y comunicación", C: "Retrasa proyectos", D: "Sustituye pruebas" }, answer: "B" },
            { q: "40. La Ingeniería de Software prepara al estudiante para:", options: { A: "Proyectos ficticios únicamente", B: "Contextos reales de desarrollo profesional", C: "Solo exámenes teóricos", D: "Programación sin planificación" }, answer: "B" }
        ];

        let currentQuizData = [];
        let score = 0;
        let answeredQuestions = 0;

        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function cleanQuestionText(text) {
            return text.replace(/^\d+\.\s*/, '');
        }

        function initQuiz() {
            const quizContainer = document.getElementById('quiz-form');
            quizContainer.innerHTML = ''; 
            score = 0;
            answeredQuestions = 0;
            updateScoreDisplay();
            
            currentQuizData = shuffleArray(originalQuizData);

            currentQuizData.forEach((item, index) => {
                const questionDiv = document.createElement('div');
                questionDiv.className = 'quiz-container';
                questionDiv.id = `question-container-${index}`;

                const questionTitle = document.createElement('div');
                questionTitle.className = 'question';
                questionTitle.innerText = `${index + 1}. ${cleanQuestionText(item.q)}`;
                questionDiv.appendChild(questionTitle);

                const optionsDiv = document.createElement('div');
                optionsDiv.className = 'options';
                optionsDiv.id = `options-${index}`;

                for (const [key, value] of Object.entries(item.options)) {
                    const label = document.createElement('label');
                    label.id = `label-${index}-${key}`;
                    
                    const radioBtn = document.createElement('input');
                    radioBtn.type = 'radio';
                    radioBtn.name = `question${index}`;
                    radioBtn.value = key;
                    
                    radioBtn.onchange = () => evaluateSingleAnswer(index, key, item.answer);

                    label.appendChild(radioBtn);
                    label.appendChild(document.createTextNode(` ${key}. ${value}`));
                    optionsDiv.appendChild(label);
                }
                questionDiv.appendChild(optionsDiv);

                const resultDiv = document.createElement('div');
                resultDiv.className = 'result-text';
                resultDiv.id = `result-${index}`;
                questionDiv.appendChild(resultDiv);

                quizContainer.appendChild(questionDiv);
            });
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function evaluateSingleAnswer(questionIndex, selectedOption, correctOption) {
            const resultDiv = document.getElementById(`result-${questionIndex}`);
            const optionsDiv = document.getElementById(`options-${questionIndex}`);

            // 1. Deshabilitar todas las opciones
            const inputs = optionsDiv.querySelectorAll('input[type="radio"]');
            inputs.forEach(input => {
                input.disabled = true;
            });
            
            const labels = optionsDiv.querySelectorAll('label');
            labels.forEach(label => {
                label.classList.add('disabled');
            });

            // 2. Iluminar la respuesta correcta siempre (en verde)
            const correctLabel = document.getElementById(`label-${questionIndex}-${correctOption}`);
            correctLabel.classList.add('label-correct');

            // 3. Revisar qué seleccionó el usuario
            resultDiv.style.display = 'block';

            if (selectedOption === correctOption) {
                resultDiv.innerHTML = "✅ ¡Correcto!";
                resultDiv.className = "result-text correct";
                score++;
            } else {
                // Si se equivocó, pintar la que eligió en rojo y tachada
                const selectedLabel = document.getElementById(`label-${questionIndex}-${selectedOption}`);
                selectedLabel.classList.add('label-incorrect');
                
                resultDiv.innerHTML = "❌ Incorrecto";
                resultDiv.className = "result-text incorrect";
            }

            answeredQuestions++;
            updateScoreDisplay();
        }

        function updateScoreDisplay() {
            const scoreContainer = document.getElementById('score-container');
            scoreContainer.innerText = `Progreso: ${answeredQuestions} / 40 | Puntaje: ${score}`;
        }

        window.onload = initQuiz;
    </script>
</body>
</html>
